## Vale configuration for FRCSoftware.org

StylesPath = .styles
MinAlertLevel = warning
Packages = Google, write-good

# Frcsoftware.Spelling (below) is our spellcheck rule; it replaces Vale's
# built-in Vale.Spelling so we control the dictionary in use. The 'Vale'
# style itself must stay in BasedOnStyles since it's what makes the Vocab
# below (and Vale.Terms/Vale.Avoid) take effect.
#
# To allow a word through spellcheck, or to enforce that a term always
# appears with a specific casing (e.g. "WPILib", not "wpilib"), add it to
# vale-accept-words.txt or src/data/glossary.yaml (see setup-vale.ts).
Vocab = Frcsoftware

[*.mdx]
BasedOnStyles = Vale, Google, write-good, Frcsoftware

# "Disabled" and "enabled" are the names of the robot's states in FRC (they're
# what the Driver Station's Enable/Disable buttons put the robot into), so
# Google.WordListCase's "use 'turn off' instead" advice doesn't apply to them.
TokenIgnores = (?i)\b(?:disabled|enabled)\b

Vale.Spelling = NO
Frcsoftware.Spelling = YES

# Google style - selectively enable useful rules
Google.GenderBias = error
Google.OxfordComma = error
Google.Spacing = error
Google.Spelling = YES
Google.WordList = error

# write-good - selectively enable useful rules
write-good.Cliches = error
write-good.Illusions = error
write-good.Passive = NO
write-good.ThereIs = YES

# Disable noisy/irrelevant Google rules
Google.Annotations = NO
Google.Colons = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.Exclamation = NO
Google.FirstPerson = NO
Google.Headings = NO
Google.HeadingPunctuation = NO
Google.Latin = NO
Google.Like = NO
Google.LyHyphens = NO
Google.Parens = NO
Google.Periods = NO
Google.Punctuation = NO
Google.Quotes = NO
Google.Ranges = NO
Google.Semicolon = NO
Google.Slang = NO
Google.Transitions = NO
Google.Units = NO
Google.UpperCase = NO
Google.We = NO
Google.Will = NO
Google.Wordiness = NO

# Disable noisy/irrelevant write-good rules
write-good.Epitext = NO
write-good.So = NO
write-good.TooWordy = NO
write-good.Weasel = NO
