# Glossary of terms and abbreviations
#
# Add terms here to automatically highlight them across the site with a dotted
# underline and hover tooltip, and to list them on /resources/glossary.
#
# Each key is the word/abbreviation to match (matched case-insensitively unless
# `caseSensitive: true`). Definitions should not have a period at the end.

# Electronics
PDH:
    definition: Power Distribution Hub

SPARK MAX:
    definition: Motor controller for REV motors

Talon FX:
    definition: Motor controller for CTRE motors

Systemcore:
    definition: Main processor for robot code, contains various IO
    caseSensitive: true

CAN:
    definition: >-
        Controller Area Network: typically yellow and green cable used to
        communicate with motor controllers and sensors, can be run in various
        topographies instead of each cable needing to connect to Systemcore
    caseSensitive: true

PWM:
    definition: >-
        Pulse Width Modulation: A communication spec used to communicate with
        motor controllers and sensors, needs to connect back to Systemcore

Main Breaker:
    definition: Power switch for the robot

Limit Switch:
    definition: >-
        Type of sensor that triggers when physically or magnetically hit.
        Can be used to trigger actions on a rising or falling edge, or check
        state of a mechanism

Throughbore Encoder:
    definition: >-
        An encoder that allows shafts to pass through its center to record
        angular position

Magnetic Encoder:
    definition: >-
        An encoder that uses a receiver and a magnet to measure position and
        motion

# Software
Repository:
    definition: >-
        A storage location for your code and related assets, often used in
        version control systems like Git.
        Repositories are just folders that contain files and subfolders, and
        they can be hosted on platforms like GitHub to facilitate collaboration
        and version tracking

CI:
    definition: >-
        Continuous Integration: A software development practice where developers
        frequently merge code changes into a shared repository, triggering
        automated builds and tests to ensures the codebase remains stable

WPILib:
    definition: >-
        WPILib is the standard software library and toolsuite provided for teams
        to write, test, and debug code for their FIRST® Robotics Competition and
        FIRST® Tech Challenge robots
    caseSensitive: true

AprilTag:
    definition: >-
        A fiducial marker (similar to a QR code) that WPILib and vendor vision
        tools can detect to determine the position and orientation of a camera
        relative to the tag
    caseSensitive: true

GitHub:
    definition: >-
        GitHub is like Google Drive, but for code.
        It hosts git repositories and allows for improved collaboration on
        projects through pull requests and issues
