name: Build and Deploy to GitHub Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.16.0

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build site
              run: pnpm build

            - name: Upload dist
              uses: actions/upload-artifact@v4
              with:
                  name: site-dist
                  path: dist/

    pdf:
        if: github.ref == 'refs/heads/main' && github.repository == 'frcsoftware/frcsoftware.org'
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.16.0

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Cache Puppeteer Chromium
              uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Download built site
              uses: actions/download-artifact@v4
              with:
                  name: site-dist
                  path: dist/

            - name: Generate PDFs
              run: pnpm pdf

            - name: Upload dist with PDFs
              uses: actions/upload-artifact@v4
              with:
                  name: site-with-pdfs
                  path: dist/

    finalize:
        runs-on: ubuntu-latest
        needs: [build, pdf]
        steps:
            - name: Download site
              uses: actions/download-artifact@v4
              with:
                  name: ${{ needs.pdf.result == 'success' && 'site-with-pdfs' || 'site-dist' }}
                  path: dist/

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist/

    deploy:
        if: github.ref == 'refs/heads/main' && github.repository == 'frcsoftware/frcsoftware.org'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: finalize
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
