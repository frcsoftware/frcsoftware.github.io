name: Preview Upload

on:
    workflow_run:
        workflows: ['Build']
        types:
            - completed

concurrency:
    group: preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

jobs:
    upload-preview:
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            pull-requests: write
        steps:
            - name: Checkout default branch for Wrangler config
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.24.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - uses: actions/download-artifact@v8
              with:
                  name: preview-dist
                  path: dist/
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Get PR number
              id: get-pr
              uses: actions/github-script@v9
              with:
                  script: |
                      const wr = context.payload.workflow_run;
                      const headBranch = wr.head_branch;
                      const owner = wr.head_repository?.owner?.login;
                      const qualifier = owner
                          ? `${owner}:${headBranch}`
                          : headBranch;
                      const { data: prs } = await github.rest.pulls.list({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          state: 'open',
                          head: qualifier,
                      });
                      if (prs.length === 0) {
                          core.setFailed('No open PR found for branch ' + headBranch);
                          return;
                      }
                      core.setOutput('pr-number', prs[0].number);

            - name: Upload preview version
              id: upload
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: '4.128.0'
                  command: 'versions upload --preview-alias pr-${{ steps.get-pr.outputs.pr-number }} --message "PR #${{ steps.get-pr.outputs.pr-number }}"'

            - name: Comment PR with preview URL
              if: success()
              uses: actions/github-script@v9
              with:
                  script: |
                      const prNumber = parseInt('${{ steps.get-pr.outputs.pr-number }}');
                      const alias = 'pr-' + prNumber;
                      const versionUrl = '${{ steps.upload.outputs.deployment-url }}';
                      if (!versionUrl) {
                          core.setFailed('wrangler-action did not report a deployment-url');
                          return;
                      }
                      const previewUrl = versionUrl.replace(
                          /^(https:\/\/)[^-]+-/,
                          `$1${alias}-`,
                      );

                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: prNumber,
                      });
                      const alreadyCommented = comments.some(
                          c => c.user?.type === 'Bot' && c.body?.includes(previewUrl)
                      );
                      if (!alreadyCommented) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: prNumber,
                              body: `🌐 Preview URL: ${previewUrl}`,
                          });
                      }
