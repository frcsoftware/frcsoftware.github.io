name: Preview (Cloudflare Pages)

on:
    pull_request_target:
        branches: [main]

concurrency:
    group: preview-${{ github.event.number }}
    cancel-in-progress: true

jobs:
    deploy-preview:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.16.0

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build site
              run: pnpm build

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist/ --project-name=frcsoftware --branch pr-${{ github.event.number }}
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}

            - name: Comment PR with preview URL
              uses: actions/github-script@v9
              with:
                  script: |
                      const previewUrl = `https://pr-${context.issue.number}.frcsoftware.pages.dev`;
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      });
                      const alreadyCommented = comments.some(
                          c => c.user?.type === 'Bot' && c.body?.includes(previewUrl)
                      );
                      if (!alreadyCommented) {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body: `🌐 Preview URL: ${previewUrl}`,
                          });
                      }
